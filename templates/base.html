<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NetworkCo{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>body{font-family:'Roboto',sans-serif;}</style>
</head>
<body class="bg-gray-50 text-gray-800">
<nav class="bg-white shadow-lg">
  <div class="container mx-auto px-6 py-4 flex justify-between items-center">
    <a href="{% url 'core:home' %}" class="text-2xl font-bold text-indigo-600">NetworkCo</a>
    <ul class="flex space-x-6">
      <li><a href="{% url 'core:home' %}"      class="hover:text-indigo-600">홈</a></li>
      <li><a href="{% url 'downloads:list' %}" class="hover:text-indigo-600">자료실</a></li>
      <li><a href="{% url 'blog:list' %}"      class="hover:text-indigo-600">블로그</a></li>
      <li><a href="{% url 'support:request' %}"class="hover:text-indigo-600">원격지원</a></li>
      <li><a href="{% url 'contact:request' %}"class="hover:text-indigo-600">문의·견적</a></li>
+     <li><a href="{% url 'faq:list' %}"       class="hover:text-indigo-600">FAQ</a></li>
    </ul>
  </div>
</nav>

  <main class="container mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>
  <footer class="bg-white border-t mt-12">
    <div class="container mx-auto px-6 py-4 text-center text-sm text-gray-500">
      &copy; 2025 NetworkCo. All rights reserved.
    </div>
  </footer>
</body>
</html>
