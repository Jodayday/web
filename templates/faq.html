{% extends "base.html" %}
{% block title %}FAQ – NetworkCo{% endblock %}
{% block content %}
  <h2 class="text-3xl font-semibold mb-6 text-indigo-600">자주 묻는 질문 (FAQ)</h2>
  <ul class="space-y-4">
    <li>
      <button class="w-full text-left p-4 bg-gray-100 rounded focus:outline-none"
              onclick="this.nextElementSibling.classList.toggle('hidden')">
        Q1. 원격지원 프로그램 설치 방법은?
      </button>
      <div class="hidden p-4 bg-white border-l-4 border-indigo-600">
        A1. 상단 다운로드 버튼을 클릭하여 설치 파일을 내려받으시고, 설치 후 안내에 따라 실행하세요.
      </div>
    </li>
    <li>
      <button class="w-full text-left p-4 bg-gray-100 rounded focus:outline-none"
              onclick="this.nextElementSibling.classList.toggle('hidden')">
        Q2. 자료실에 파일을 올리려면 어떻게 하나요?
      </button>
      <div class="hidden p-4 bg-white border-l-4 border-indigo-600">
        A2. 관리자 계정으로 로그인한 후, Django Admin의 ‘Document’ 모델에서 새 파일을 추가하실 수 있습니다.
      </div>
    </li>
    <!-- 필요한 만큼 항목 추가 -->
  </ul>
{% endblock %}
